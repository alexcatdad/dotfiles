name: checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches formulae and casks renamed or removed upstream.
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Lint and link test
        run: sh scripts/test.sh
      - name: Secret scan (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  bootstrap:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Lint and link test
        run: sh scripts/test.sh
      - name: Every Brewfile entry still resolves
        run: |
          set -eu
          awk -F'"' '$1=="tap "{print $2}' Brewfile | while read -r tap; do brew tap "$tap"; done
          awk -F'"' '$1=="brew "{print $2}' Brewfile | xargs brew info --formula > /dev/null
          awk -F'"' '$1=="cask "{print $2}' Brewfile | xargs brew info --cask > /dev/null
      - name: Install formulae
        # Casks and App Store apps are skipped: large, slow, and mas needs an Apple ID.
        run: |
          grep -E '^(tap|brew) ' Brewfile > "$RUNNER_TEMP/Brewfile"
          brew bundle --file "$RUNNER_TEMP/Brewfile"
      - name: Shell starts cleanly with everything installed
        run: sh scripts/test.sh shell
