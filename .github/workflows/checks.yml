name: checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches formulae and casks renamed or removed upstream.
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Lint and link test
        run: sh scripts/test.sh
      - name: Secret scan (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner

  bootstrap:
    # container and tart require macOS 26 or later.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Launchd plists
        run: plutil -lint launchd/*.plist
      - name: Link and shell test
        run: sh scripts/test.sh shell
      - name: Need formulae? Only when packages or shell startup changed
        # Scheduled and manual runs, and pushes with no usable base, always install.
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          install=true
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD \
              | grep -Eq '^(Brewfile|bootstrap\.sh|machines/|scripts/(link|test)\.sh|\.github/workflows/|home/(\.zsh|\.bash|\.profile|\.config/shell/))' \
              || install=false
          fi
          echo "install=$install" >> "$GITHUB_OUTPUT"
      - name: Every Brewfile entry still resolves
        run: |
          set -eu
          awk -F'"' '$1=="tap "{print $2}' Brewfile | while read -r tap; do brew tap "$tap"; brew trust --tap "$tap"; done
          awk -F'"' '$1=="brew "{print $2}' Brewfile | xargs brew info --formula > /dev/null
          awk -F'"' '$1=="cask "{print $2}' Brewfile | xargs brew info --cask > /dev/null
      - name: Install formulae
        if: steps.scope.outputs.install == 'true'
        # Casks and App Store apps are skipped: large, slow, and mas needs an Apple ID.
        run: |
          grep -E '^(tap|brew) ' Brewfile > "$RUNNER_TEMP/Brewfile"
          brew bundle --file "$RUNNER_TEMP/Brewfile"
      - name: Shell starts cleanly with everything installed
        if: steps.scope.outputs.install == 'true'
        run: sh scripts/test.sh shell
